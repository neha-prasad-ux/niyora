[package]
name = "niyora"
version = "0.5.0"
description = "A privacy-first breathing and mindfulness app for macOS and Windows."
authors = ["Neha Prasad"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"] }
rand = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
cocoa = "0.26"
objc = "0.2"
mac-notification-sys = "0.6"
# HRV companion sync (milestones 3-4): mDNS advertise, TCP push of session
# windows, QR-based pairing with HMAC-SHA256 auth, queued send when no peer
# is connected. macOS-only because HealthKit (the companion's reason to
# exist) is Apple-only.
mdns-sd = "0.11"
tokio = { version = "1", features = ["net", "sync", "rt", "rt-multi-thread", "macros", "io-util", "time"] }
security-framework = "3"
hmac = "0.12"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
