name: Build Niyora

on:
  push:
    branches: [main, feat/*]
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
          - name: Intel
            runner: macos-13
            target: x86_64-apple-darwin
            arch: x86_64

    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Ad-hoc codesign
        run: codesign -s - --force --deep "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Niyora.app"

      - name: Create zip
        run: |
          cd "src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          ditto -c -k --keepParent Niyora.app "Niyora-${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Niyora-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/macos/Niyora-${{ matrix.arch }}.zip
